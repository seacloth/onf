[package]
name = "onf"
version = "0.1.3"
edition = "2021"
description = "A minimal configuration profile switcher"
license = "MIT"
repository = "https://github.com/seacloth/onf"
homepage = "https://github.com/seacloth/onf"
readme = "README.md"
keywords = ["config", "dotfiles", "cli", "profiles", "symlink"]
categories = ["command-line-utilities"]

[[bin]]
name = "onf"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
colored = "2"
anyhow = "1.0.102"
flate2 = "1"
tar = "0.4"
